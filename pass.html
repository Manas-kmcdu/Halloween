<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Check your invite · Halloween House</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0C;--fg:#F4F0E8;--o:#FF6A2A;--g:#929292;--l:#292929;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(circle at 80% -10%,rgba(255,106,42,.25),transparent 55%),var(--bg);color:var(--fg);font:16px/1.5 Inter,system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow-x:hidden}
.card{position:relative;z-index:2;width:100%;max-width:420px;border:1px solid #3a3a3a;border-radius:16px;background:linear-gradient(160deg,#161617,#0d0d0e);padding:32px 26px;text-align:center}
.eyebrow,.lbl{font-size:11px;letter-spacing:.25em;color:var(--g);text-transform:uppercase}
h1{font:400 52px/1 Anton,Impact,sans-serif;margin:10px 0 4px;letter-spacing:2px;text-transform:uppercase}
h1 em{font-style:normal;color:var(--o)}
.sub{font:400 15px Anton,Impact,sans-serif;letter-spacing:.35em;margin:0 0 20px}
.pump{font-size:72px;line-height:1;margin:6px 0 10px;filter:drop-shadow(0 0 22px rgba(255,106,42,.55));animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px) rotate(-4deg)}}
p{color:#cfcabf;margin:0 0 22px}
.btn{display:inline-block;border:0;cursor:pointer;background:var(--o);color:var(--bg);font:600 15px Inter,sans-serif;text-decoration:none;padding:14px 26px;border-radius:10px;letter-spacing:.04em}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5}
.btn.g{background:transparent;color:var(--fg);border:1px solid #4a4a4a;margin-top:12px}
form{text-align:left}
.pf{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--l);margin:8px 0 6px}
.pf:focus-within{border-color:var(--o)}
.pf b{color:var(--g);font-weight:500}
input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--fg);font:inherit;font-size:18px;padding:12px 0;letter-spacing:.06em}
.er{color:var(--o);font-size:14px;margin:6px 0 0;min-height:1em}
.lbl.t{margin-top:18px;text-align:left}
.val{font-weight:600;text-align:left}
.name{font:400 38px/1.1 Anton,Impact,sans-serif;letter-spacing:2px;text-align:left;text-transform:uppercase;word-break:break-word}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
hr{border:0;border-top:2px dashed #3a3a3a;margin:24px 0 0}
.pid{margin-top:16px;font-weight:600;letter-spacing:.2em;font-size:13px;text-align:left}
.chip{display:inline-block;margin-top:14px;padding:6px 14px;border:1px solid rgba(255,106,42,.55);border-radius:99px;color:var(--o);font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.org{display:block;margin-top:0;background:transparent;color:var(--fg);border:1px solid var(--o);text-align:center}
.org:hover{background:var(--o);color:var(--bg)}
.bat{position:fixed;top:-40px;font-size:26px;opacity:.5;z-index:1;animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) translateX(40px) rotate(25deg)}}
</style></head><body>
<div class="card"><div id="c"></div></div>
<script>
var LOOKUP="https://script.google.com/macros/s/AKfycbyNSM9ZBVBqeLwQQn52q6OIQvw_AKt3bD--naBl7nL7lcHeuLxQTvRaU3iEN-esaMkLIg/exec",
PAY="https://halloween.unrestdu.in/pay.html",SITE="https://halloween.unrestdu.in/",
c=document.getElementById("c");
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function clean(v){return String(v||"").replace(/[\s-]/g,"").replace(/^(\+91|91|0)(?=\d{10}$)/,"")}
function form(err){
 c.innerHTML='<div class="pump"></div><h1>Your <em>invite</em></h1><div class="sub">HALLOWEEN HOUSE</div>'
 +'<form id="f" novalidate><label class="lbl" for="p">Contact number</label><div class="pf"><b>+91</b><input id="p" inputmode="tel" placeholder="10-digit mobile number" autocomplete="tel"></div>'
 +'<p class="er" id="e">'+esc(err||"")+'</p><button class="btn" id="b" type="submit" style="width:100%">Check my invite →</button></form>';
 document.getElementById("f").onsubmit=function(ev){ev.preventDefault();var p=clean(document.getElementById("p").value);
  if(!/^[6-9]\d{9}$/.test(p)){document.getElementById("e").textContent="Enter a valid 10-digit mobile number.";return}
  check(p)}}
function oops(){
 c.innerHTML='<div class="pump">🎃</div><h1>Oops<em>!</em></h1>'
 +'<p>Looks like you haven\u2019t confirmed your invite yet. Pay for your pass to lock in your spot.</p>'
 +'<a class="btn" href="'+PAY+'">Confirm my invite →</a><br><button class="btn g" data-again="1">Check another number</button>'}
function msg(h,t,extra){
 c.innerHTML='<div class="pump">👻</div><h1>'+h+'</h1><p>'+t+'</p>'+(extra||"")+'<br><button class="btn g" data-again="1">Check another number</button>'}
function pass(d,p){
 var id=d.id||"UH-"+p.slice(-4);
 c.innerHTML='<div class="eyebrow">Unrest presents</div><h1>Trick or <em>Treat</em></h1><div class="sub">HALLOWEEN HOUSE</div>'
 +'<div class="lbl t">Guest</div><div class="name">'+esc(d.name||"Guest")+'</div>'
 +'<div class="grid"><div><div class="lbl t">College</div><div class="val">'+esc(d.college||"-")+'</div></div><div><div class="lbl t">Year</div><div class="val">'+esc(d.year||"-")+'</div></div>'
 +'<div><div class="lbl t">Date</div><div class="val">Sun, 1 Nov 2026</div></div><div><div class="lbl t">Time</div><div class="val">1 PM – 10 PM</div></div></div>'
 +'<hr><div class="pid">PASS ID &nbsp;'+esc(id)+'</div>'
 +'<div class="chip">'+(d.pay==="paid"?"Confirmed":d.pay==="verifying"?"Verifying":"Not Confirmed")+'</div>'
 +(d.pay==="paid"||d.pay==="verifying"?"":'<p style="margin:16px 0 0"></p><div style="margin-top:12px"><a class="btn" href="'+PAY+'">Pay Rs 999 to confirm →</a></div>')
 +'<div style="margin-top:12px"><a class="btn org" href="https://wa.me/919650692251?text=Hi%20Unrest%2C%20I%20need%20help%20with%20my%20Halloween%20House%20invite." target="_blank" rel="noopener noreferrer">Talk to the organiser</a></div>'
 +'<br><button class="btn g" data-again="1">Check another number</button>'}
function check(p){
 var b=document.getElementById("b");if(b){b.disabled=true;b.textContent="Checking…"}
 fetch(LOOKUP+(LOOKUP.indexOf("?")<0?"?":"&")+"phone="+encodeURIComponent(p)).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
  var s=d&&d.status;
  if(s==="approved")pass(d,p);
  else if(s==="pending")msg('Under <em>review</em>',"We have your request. The Unrest team is still reviewing it. Check back soon.");
  else if(s==="declined")msg('Not this <em>time</em>',"We could not approve this request. Reach out to the Unrest team if you think this is a mistake.");
  else oops();                                         /* no pass found */
 }).catch(function(){form("Could not check right now. Check your connection and try again.")})}
c.addEventListener("click",function(e){if(e.target.closest&&e.target.closest("[data-again]"))form()});
form();
var q=clean(new URLSearchParams(location.search).get("phone"));if(/^[6-9]\d{9}$/.test(q))check(q);
for(var i=0;i<9;i++){var x=document.createElement("div");x.className="bat";x.textContent=i%3?"🦇":"👻";x.style.left=(i*11+Math.random()*8)+"%";x.style.animationDuration=(9+Math.random()*8)+"s";x.style.animationDelay=(-Math.random()*12)+"s";document.body.appendChild(x)}
</script></body></html>
